[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cropgen"
version = "0.1.0"
description = "First step in the generation of the dataset for fine-tuning an LLM in vision tasks, other training helpers (collators, loggers, etc.)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
    "scipy>=1.14.0",
    "python-levenshtein>=0.27.3",
    "levenshtein>=0.27.3",
    "fuzzywuzzy>=0.18.0",
    "label-studio-sdk>=2.0.19",
    "pydantic>=2.10.0,<2.12.4",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
    "ruff>=0.15.9",
    "pillow>=12.1.1",
    "torch",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.10.8",
    "torch>=2.10.0",
    "ipywidgets>=8.1.8",
    "xformers>=0.0.35; sys_platform == 'linux'",
    "bitsandbytes>=0.49.2; sys_platform == 'linux'",
    "torchvision>=0.25.0",
    "accelerate>=1.13.0",
    "trl>=0.24.0",
    "triton>=3.6.0; sys_platform == 'linux'",
    "cut-cross-entropy>=25.1.1; sys_platform == 'linux'",
    "unsloth-zoo>=2026.4.8; sys_platform == 'linux'",
    "sentencepiece>=0.2.1",
    "protobuf>=7.34.1",
    "huggingface-hub>=1.11.0",
    "hf-transfer>=0.1.9",
    "transformers>=5.5.0",
    "jiwer>=4.0.0",
    "peft",
    "unsloth; sys_platform == 'linux'",
]


[tool.setuptools.packages.find]
include = ["cropgen*"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
cropgen = { workspace = true }
peft = { git = "https://github.com/huggingface/peft.git" }
unsloth = { git = "https://github.com/unslothai/unsloth.git" }

[dependency-groups]
dev = [
    "cropgen",
    "ty>=0.0.72",
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
]


[pytest]
markers = [
    "audit: marks tests as an audit to the structure of the annotations.",
]
